<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker • Automated Unit Test Runner</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
      --accent: #38bdf8;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 2rem;
      margin: 0;
    }
    .test-container {
      max-width: 900px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2rem;
    }
    h1 { margin: 0; font-size: 1.75rem; font-weight: 800; }
    .suite-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }
    .suite-header {
      padding: 1rem 1.25rem;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .test-item {
      padding: 0.85rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.9rem;
    }
    .test-item:last-child { border-bottom: none; }
    .badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 9999px;
      font-weight: 700;
    }
    .badge-pass { background: rgba(16, 185, 129, 0.2); color: var(--success); }
    .badge-fail { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
    .error-msg {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--danger);
      margin-top: 4px;
    }
    .summary-bar {
      display: flex;
      gap: 1.5rem;
      font-weight: 700;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <div class="test-container">
    <div class="header">
      <div>
        <h1>Habit Tracker Test Suite</h1>
        <div style="color: var(--text-muted); font-size: 0.85rem; margin-top: 4px;">Zero-dependency unit test runner verifying core engines.</div>
      </div>
      <div class="summary-bar" id="summary-bar">
        <!-- Summary stats populated via script -->
      </div>
    </div>

    <div id="test-suites-container">
      <!-- Dynamic test output -->
    </div>
  </div>

  <script type="module">
    import { formatDate, parseDate, addDays, diffInDays, getDayOfWeek, escapeHTML } from './js/utils.js';
    import { calculateHabitStreak, isHabitScheduledOnDate } from './js/streaks.js';
    import { calculateLevel, calculateCompletionXP } from './js/gamification.js';
    import { validateAndRepair, migrateSchema, validateImportJSON } from './js/storage.js';

    const testResults = [];

    function suite(name, fn) {
      const suiteObj = { name, tests: [] };
      testResults.push(suiteObj);
      const test = (testName, testFn) => {
        try {
          testFn();
          suiteObj.tests.push({ name: testName, pass: true });
        } catch (err) {
          suiteObj.tests.push({ name: testName, pass: false, error: err.message });
        }
      };
      fn(test);
    }

    function assertEqual(actual, expected, msg = '') {
      if (actual !== expected) {
        throw new Error(`${msg} Expected ${JSON.stringify(expected)}, but got ${JSON.stringify(actual)}`);
      }
    }

    function assertTrue(val, msg = '') {
      if (!val) throw new Error(`${msg} Expected truthy value`);
    }

    function assertFalse(val, msg = '') {
      if (val) throw new Error(`${msg} Expected falsy value`);
    }

    // =========================================================================
    // Suite 1: Date & Time Helpers
    // =========================================================================
    suite('Date Calculations & Helpers', (test) => {
      test('formatDate correctly formats YYYY-MM-DD', () => {
        const d = new Date(2026, 10, 25); // Nov 25, 2026
        assertEqual(formatDate(d), '2026-11-25');
      });

      test('addDays adds positive and negative days across month boundaries', () => {
        assertEqual(addDays('2026-10-31', 1), '2026-11-01');
        assertEqual(addDays('2026-11-01', -1), '2026-10-31');
        assertEqual(addDays('2026-12-31', 1), '2027-01-01');
      });

      test('diffInDays returns exact day delta without timezone drift', () => {
        assertEqual(diffInDays('2026-11-01', '2026-11-08'), 7);
        assertEqual(diffInDays('2026-11-25', '2026-11-25'), 0);
        assertEqual(diffInDays('2026-11-10', '2026-11-05'), -5);
      });

      test('getDayOfWeek matches Sunday=0 through Saturday=6', () => {
        // 2026-11-25 is a Wednesday (3)
        assertEqual(getDayOfWeek('2026-11-25'), 3);
      });

      test('escapeHTML prevents XSS injection', () => {
        const payload = '<script>alert("xss")</script>&"\'';
        const safe = escapeHTML(payload);
        assertFalse(safe.includes('<script>'));
        assertTrue(safe.includes('&lt;script&gt;'));
      });
    });

    // =========================================================================
    // Suite 2: Streak Engine
    // =========================================================================
    suite('Streak Engine & Frequency Rules', (test) => {
      const dailyHabit = {
        id: 'h_daily',
        startDate: '2026-11-01',
        frequency: 'daily'
      };

      test('Daily habit computes continuous current streak', () => {
        const completions = [
          { habitId: 'h_daily', date: '2026-11-23', status: 'done' },
          { habitId: 'h_daily', date: '2026-11-24', status: 'done' },
          { habitId: 'h_daily', date: '2026-11-25', status: 'done' }
        ];
        const s = calculateHabitStreak(dailyHabit, completions, '2026-11-25');
        assertEqual(s.currentStreak, 3);
        assertEqual(s.totalCompletions, 3);
      });

      test('Weekday-only habit (Mon-Fri) does not break over the weekend', () => {
        // 2026-11-20 is Friday, 21 is Sat, 22 is Sun, 23 is Mon
        const weekdayHabit = {
          id: 'h_work',
          startDate: '2026-11-01',
          frequency: 'weekdays',
          frequencyData: { days: [1, 2, 3, 4, 5] }
        };
        const completions = [
          { habitId: 'h_work', date: '2026-11-20', status: 'done' }, // Fri
          { habitId: 'h_work', date: '2026-11-23', status: 'done' }  // Mon
        ];
        const s = calculateHabitStreak(weekdayHabit, completions, '2026-11-23');
        assertEqual(s.currentStreak, 2);
      });

      test('Streak freeze preserves streak on a missed day', () => {
        const completions = [
          { habitId: 'h_daily', date: '2026-11-22', status: 'done' },
          // Missed 2026-11-23
          { habitId: 'h_daily', date: '2026-11-24', status: 'done' },
          { habitId: 'h_daily', date: '2026-11-25', status: 'done' }
        ];
        // With 1 freeze available
        const s = calculateHabitStreak(dailyHabit, completions, '2026-11-25', 1);
        assertEqual(s.currentStreak, 3);
        assertEqual(s.freezesUsed, 1);
      });

      test('Skip day preserves streak without consuming freeze', () => {
        const completions = [
          { habitId: 'h_daily', date: '2026-11-23', status: 'done' },
          { habitId: 'h_daily', date: '2026-11-24', status: 'skipped' }, // Rest day
          { habitId: 'h_daily', date: '2026-11-25', status: 'done' }
        ];
        const s = calculateHabitStreak(dailyHabit, completions, '2026-11-25', 0);
        assertEqual(s.currentStreak, 2);
        assertEqual(s.freezesUsed, 0);
      });
    });

    // =========================================================================
    // Suite 3: Storage Validation & Migration
    // =========================================================================
    suite('Storage & Data Recovery', (test) => {
      test('validateAndRepair deduplicates completions on habitId + date', () => {
        const rawState = {
          habits: [{ id: 'h1', name: 'Habit 1' }],
          completions: [
            { habitId: 'h1', date: '2026-11-25', status: 'done' },
            { habitId: 'h1', date: '2026-11-25', status: 'done' } // Duplicate!
          ]
        };
        const { state, wasRepaired } = validateAndRepair(rawState);
        assertTrue(wasRepaired);
        assertEqual(state.completions.length, 1);
      });

      test('validateImportJSON rejects invalid JSON and accepts valid schema', () => {
        const invalid = validateImportJSON('not a json');
        assertFalse(invalid.valid);

        const validJSON = JSON.stringify({
          appName: 'HabitFlowPro',
          data: {
            habits: [{ id: 'h1', name: 'Test' }],
            completions: []
          }
        });
        const result = validateImportJSON(validJSON);
        assertTrue(result.valid);
        assertEqual(result.preview.habitsCount, 1);
      });
    });

    // =========================================================================
    // Suite 4: Gamification & Levels
    // =========================================================================
    suite('Gamification & XP Formula', (test) => {
      test('calculateLevel computes accurate levels and progress %', () => {
        const lvl1 = calculateLevel(0);
        assertEqual(lvl1.level, 1);
        assertEqual(lvl1.progressPct, 0);

        const lvl2 = calculateLevel(120);
        assertEqual(lvl2.level, 2);
        assertTrue(lvl2.progressPct > 0);
      });

      test('calculateCompletionXP applies priority scale and streak multipliers', () => {
        const habitHigh = { priority: 'high' };
        const xpNoStreak = calculateCompletionXP(habitHigh, 0);
        assertEqual(xpNoStreak, 30);

        const xp10Streak = calculateCompletionXP(habitHigh, 10);
        assertTrue(xp10Streak > 30);
      });
    });

    // =========================================================================
    // Render Results to DOM
    // =========================================================================
    const container = document.getElementById('test-suites-container');
    const summaryBar = document.getElementById('summary-bar');
    let totalPassed = 0;
    let totalFailed = 0;

    testResults.forEach((s) => {
      const suiteEl = document.createElement('div');
      suiteEl.className = 'suite-card';

      const sPassed = s.tests.filter((t) => t.pass).length;
      const sTotal = s.tests.length;

      suiteEl.innerHTML = `
        <div class="suite-header">
          <span>${s.name}</span>
          <span class="badge ${sPassed === sTotal ? 'badge-pass' : 'badge-fail'}">${sPassed}/${sTotal} Passed</span>
        </div>
      `;

      s.tests.forEach((t) => {
        if (t.pass) totalPassed++;
        else totalFailed++;

        const item = document.createElement('div');
        item.className = 'test-item';
        item.innerHTML = `
          <div>
            <div>${t.name}</div>
            ${t.error ? `<div class="error-msg">${t.error}</div>` : ''}
          </div>
          <span class="badge ${t.pass ? 'badge-pass' : 'badge-fail'}">${t.pass ? 'PASS' : 'FAIL'}</span>
        `;
        suiteEl.appendChild(item);
      });

      container.appendChild(suiteEl);
    });

    summaryBar.innerHTML = `
      <span style="color: var(--success);">✓ ${totalPassed} Passed</span>
      ${totalFailed > 0 ? `<span style="color: var(--danger);">✗ ${totalFailed} Failed</span>` : '<span style="color: var(--text-muted);">0 Failures</span>'}
    `;
  </script>
</body>
</html>
